    <g id="mantle">
      <path d="M425 322C373 329 354 374 311 394L350 390 290 451 328 441 273 516 314 502 295 552 346 532 331 580 385 557 422 569 451 492 456 363z" fill="url(#cloak)" stroke="#9d4c46" stroke-width="2"/>
      <path d="M414 353C373 402 391 466 333 535l45-19-14 28 43-25 29-103M385 363l-28 83-42 45" fill="none" stroke="#b14c42" opacity=".4"/>
      <path d="M298 550l18-44-3 27 33-12-24 30 13-8-7 25 23-18" fill="none" stroke="#ff9c45" stroke-width="2" filter="url(#glow)"/>
    </g>
    <path d="M444 461l-28 74-37 78-3 31 28 3 41-81 39-64z" fill="url(#metal)" stroke="#8e4e49" stroke-width="2"/>
    <path d="M462 476l48 46 20 88 23 30-29 8-36-37-25-66-31-30z" fill="url(#metal)" stroke="#995247" stroke-width="2"/>
    <path d="M397 563l28-11-15 28-18 9zM492 556l28 2 6 29-24-12z" fill="#754246" stroke="#d47550"/>
    <path d="M380 610l23 1-2 27 15 14-52 3 4-15zM520 610l17-4 15 28 26 14-1 7-56-3-10-19z" fill="#171824" stroke="#9b5e50" stroke-width="2"/>
    <path d="M374 645l29-3m120 1 31-4" stroke="#ff9951" stroke-width="2"/>
    <path d="M435 343C447 329 473 334 488 352l8 55-20 61-53-3-13-65z" fill="url(#skin)" stroke="#3b1e2d" stroke-width="3"/>
    <path d="M421 378l38 17 32-24-8 50-24 28-38-30z" fill="url(#metal)" stroke="#a15c50" stroke-width="2"/>
    <path d="M459 397l1 44m-33-45 17 14m38-18-14 14" fill="none" stroke="#ff8c4b" stroke-width="2" filter="url(#glow)"/>
    <path d="M427 439l48 4 10 24-62 7-9-18z" fill="#24202d" stroke="#ae6350" stroke-width="2"/>
    <path d="M448 447l16 1 8 12-17 9-13-13z" fill="#b15b43"/><path d="M452 453l9 1-5 8z" fill="#ffc56d"/>
    <path d="M420 470l23 2-7 56-31 16zM449 475l22-5 24 51-29-10-13 17z" fill="url(#cloak)" stroke="#a65849" stroke-width="2"/>
    <!-- The extended bow arm. -->
    <path d="M477 348Q492 338 511 344L567 349 636 339 651 346 649 361 572 370 502 369 480 365z" fill="url(#skin)" stroke="#3b2030" stroke-width="3"/>
    <path d="M556 347l26-3 13 23-27 6z" fill="url(#metal)" stroke="#cd7958" stroke-width="2"/>
    <path d="M564 348l12 20m-4-20 12 19" stroke="#e3a26c" opacity=".6"/>
    <path d="M628 342l17-7 17 7-1 15-16 9-15-5z" fill="#bd634d" stroke="#4b2936" stroke-width="2"/>
    <path d="M648 342l8 3-1 13m-15-14 8 5-1 12" fill="none" stroke="#e69262"/>
    <!-- Serrated shoulder plate. -->
    <path d="M410 339l-22-26 27 9-3-27 23 27 13-17 5 25 24 19-18 22-31-7z" fill="url(#metal)" stroke="#bd6a54" stroke-width="2"/>
    <path d="M413 341l20-7 22 16-18 3z" fill="#5b3942"/>
