<!doctype html><style>html,body{margin:0;width:100%;height:100%}#shape{position:absolute;left:20%;top:20%;width:40%;height:40%;background:#527cac}</style><div id="shape"></div><script type="module">
import {bindRender} from '/assets/play/html.js';
window.effects={keys:0,mouse:0};let io=false;
addEventListener('keydown',()=>{if(io)effects.keys++});
addEventListener('pointerdown',()=>{if(io)effects.mouse++});
await bindRender({renders:['alternate'],scenarios:['alternate'],io:on=>{io=on;if(on)window.focus()},
play:()=>document.querySelector('#shape').style.background='#c85b4a',
reset:()=>document.querySelector('#shape').style.background='#527cac'});
</script>
