<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <radialGradient id="night"><stop stop-color="#281720"/><stop offset=".58" stop-color="#100f19"/><stop offset="1" stop-color="#070a11"/></radialGradient>
    <radialGradient id="aura"><stop stop-color="#ff6b24" stop-opacity=".25"/><stop offset=".7" stop-color="#ed3418" stop-opacity=".07"/><stop offset="1" stop-color="#e62d19" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" x2="1" y2="1"><stop stop-color="#6b4248"/><stop offset=".32" stop-color="#302b3b"/><stop offset="1" stop-color="#10131f"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y2="0"><stop stop-color="#b64c40"/><stop offset=".55" stop-color="#f59358"/><stop offset="1" stop-color="#732d39"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c65440"/><stop offset=".45" stop-color="#75303a"/><stop offset="1" stop-color="#301c30"/></linearGradient>
    <linearGradient id="horn" x1="0" x2=".7" y2="1"><stop stop-color="#ffcb83"/><stop offset=".25" stop-color="#9d5a51"/><stop offset="1" stop-color="#392a38"/></linearGradient>
    <linearGradient id="cloak" x1="0" x2="1" y2=".5"><stop stop-color="#191527"/><stop offset=".6" stop-color="#4c2334"/><stop offset="1" stop-color="#9c3a3c"/></linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2=".25" y2="0"><stop stop-color="#fff0b1"/><stop offset=".28" stop-color="#ffc451"/><stop offset=".6" stop-color="#ff6524"/><stop offset="1" stop-color="#db2737" stop-opacity=".3"/></linearGradient>
    <linearGradient id="crown-violet" x1="0" y1="1" x2=".25" y2="0"><stop stop-color="#f6e9ff"/><stop offset=".28" stop-color="#d5a0ff"/><stop offset=".6" stop-color="#9e4dff"/><stop offset="1" stop-color="#5916c9" stop-opacity=".5"/></linearGradient>
    <linearGradient id="trail"><stop stop-color="#e52338" stop-opacity="0"/><stop offset=".55" stop-color="#ff5e27" stop-opacity=".65"/><stop offset="1" stop-color="#fff1b3"/></linearGradient>
    <radialGradient id="release-light"><stop stop-color="#fff8d6" stop-opacity=".95"/><stop offset=".2" stop-color="#ffd781" stop-opacity=".8"/><stop offset=".55" stop-color="#ff7738" stop-opacity=".3"/><stop offset="1" stop-color="#ff4828" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <path fill="url(#night)" d="M0 0H1280V800H0z"/>
  <ellipse cx="475" cy="395" rx="410" ry="355" fill="url(#aura)"/>
  <!-- Broken eclipse; the empty right-hand field is the arrow's flight path. -->
  <g fill="none" stroke="#d3583b">
    <circle cx="456" cy="354" r="227" stroke-width="1" opacity=".15"/>
    <path d="M269 482A227 227 0 0 1 526 138M600 178A227 227 0 0 1 676 413" stroke-width="3" opacity=".3"/>
    <path d="M229 329l-13-2m34-72-12-6m55-58-8-10m79-37-4-13m89 7v-14m84 31 5-12m64 60 10-9m29 82 14-4" opacity=".4"/>
  </g>
  <g fill="#151420" stroke="#30202a" stroke-width="1">
    <path d="M0 644l76-19 80 17 100-30 92 19 91-9 96 16 105-14 109 18 104-14 107 29 93-11 122 24v130H0z"/>
    <path d="M190 661l37-35 87 6 32 25-66 14zM440 655l49-31 64 21 30 27-80 14zM617 678l59-40 84 7 21 31-80 14z"/>
  </g>
  <ellipse id="ground-light" cx="468" cy="649" rx="178" ry="18" fill="#f44b24" opacity=".22" filter="url(#soft)"/>
  <ellipse cx="458" cy="654" rx="137" ry="12" fill="#04060d" opacity=".7"/>
  <g fill="none" stroke="#f16a38" stroke-linecap="round">
    <path d="M224 670l65 5 22 15 59-9 34 13m153-22 34 13 59-3 23 12 45-6" opacity=".35"/>
    <path d="M353 648l39-4 13 6 28-2m76 12 28-4 21 8" opacity=".7"/>
  </g>

