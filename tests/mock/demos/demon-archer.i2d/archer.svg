    <g id="crown-fire" fill="url(#crown-violet)" opacity=".9" filter="url(#glow)">
      <g transform="translate(451 318) scale(1 1.65) translate(-451 -318)">
        <path d="M424 299C394 274 423 253 406 217c30 16 14 47 37 48-10-31 13-38 7-66 29 26 4 52 28 65-5-22 16-32 19-49 14 42-1 61-9 86z"/>
        <path d="M418 318c-34-12-34-34-28-52 11 16 7 23 28 29z"/>
      </g>
    </g>
    <path d="M437 319l2 27 24 10 16-15-15-29z" fill="url(#skin)" stroke="#402030" stroke-width="2"/>
    <path d="M430 264l-25-22-11-40 19 20 22 10 15 30zM464 258l21-28 7-37 9 27-1 29-24 27z" fill="url(#horn)" stroke="#b66b51" stroke-width="2"/>
    <path d="M404 223l13 9m-10 4 17 6m66-16 9 5m-13 8 12 4" stroke="#432638" stroke-width="3"/>
    <path d="M429 260l26-12 28 19 9 22-8 17-6 23-20 12-23-16-12-32z" fill="url(#skin)" stroke="#e08555" stroke-width="2"/>
    <path d="M431 261l24 11 15-15 4 31 18 1-14 16-3 19-15 12-1-31-25-13z" fill="#292130"/>
    <path d="M432 283l20 6-6 8-13-6zM468 288l16-7-3 11-12 4z" fill="#ffe49a" filter="url(#glow)"/>
    <path d="M460 298l-7 17 10 2m-13 5 14 2 9-8" fill="none" stroke="#f39361" stroke-width="2"/>
    <path d="M449 322l4 8 3-7m9-1 1 6 5-9" fill="#fbd09a"/>
    <path d="M428 298l-13 7 16 9m50-45 14 1-8 7" fill="#a95446"/>
    <!-- Near arm and drawing hand move with the bowstring. -->
    <path id="draw-arm" d="M447 356Q429 353 424 376L449 394 638 357 635 344 450 374 465 363z" fill="url(#skin)" stroke="#422131" stroke-width="3"/>
    <path id="draw-bracer" d="M583 355l40-8 5 16-39 10z" fill="url(#metal)" stroke="#ca7754" stroke-width="2"/>
    <g id="draw-hand" transform="translate(638 350)">
      <path d="M-13-8l14-5 10 6-1 17-13 5-12-7z" fill="#bd6249" stroke="#482332" stroke-width="2"/>
      <path d="M-3-9l5 6-1 12m-7-14 4 6-2 6" fill="none" stroke="#f5a16d"/>
    </g>
    <!-- Organic recurve bow, tall enough to read immediately in silhouette. -->
    <g id="bow">
      <path id="bow-limb" d="M639 181C707 215 697 279 662 338L660 362C699 425 695 479 637 520" fill="none" stroke="#1c1724" stroke-width="15"/>
      <path id="bow-edge" d="M639 181C707 215 697 279 662 338L660 362C699 425 695 479 637 520" fill="none" stroke="url(#edge)" stroke-width="8"/>
      <path d="M639 181l-9-22 24 18-4 14M637 520l-8 22 24-18-6-14M684 230l23-10-17 29M684 466l23 10-17-29" fill="url(#horn)" stroke="#bd7054" stroke-width="1.5"/>
      <path id="bow-string" d="M639 181L638 350 637 520" fill="none" stroke="#ffd49b" stroke-width="1.5" opacity=".9"/>
      <path d="M658 335l8 1-1 31-10-1z" fill="#2d202b" stroke="#e08b5a" stroke-width="2"/>
      <path d="M658 342l7 3m-8 4 7 3m-7 4 7 3" stroke="#ea9a62"/>
      <path d="M654 195c23 14 24 25 28 40m-29 271c21-14 26-27 29-39" fill="none" stroke="#ffad54" stroke-width="2" filter="url(#glow)"/>
    </g>
    <g id="flight-trail" opacity="0" filter="url(#glow)">
      <path id="trail-ribbon" d="M0 0" fill="url(#trail)"/>
      <path id="trail-flames" d="M0 0" fill="url(#fire)"/>
      <path id="trail-core" d="M0 0" fill="none" stroke="#ffe8a5" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="arrow" transform="translate(638 350)">
      <path d="M-7-1H185" fill="none" stroke="#fbc37c" stroke-width="3"/>
      <path d="M4-1l-18-11-12 2L-9 0l-17 9 13 2L5 1" fill="#bf5a43" stroke="#e8995c"/>
      <g id="arrow-fire" filter="url(#glow)">
        <path d="M198 0C174-19 160-10 144-23l8 16c-21-5-35-1-51-8l22 17-17 8c25-4 37 10 52 2l-10 13c20-3 30-10 50-25z" fill="url(#fire)"/>
        <path d="M199 0l-37-8 12 8-13 8z" fill="#fff0b0"/>
      </g>
      <path d="M176-6l23 6-23 6 5-6z" fill="#fff5cf"/>
    </g>
    <g id="release-flash" opacity="0" fill="#ffda88" filter="url(#glow)">
      <circle cx="662" cy="350" r="82" fill="url(#release-light)"/>
      <path d="M662 288l7 53 54 9-54 7-7 55-8-55-53-7 53-9z" fill="#fff4c3"/>
      <path d="M630 318l26 25 32-20-19 28 26 31-32-23-29 24 21-31z" opacity=".65"/>
      <circle id="release-ring" cx="662" cy="350" r="14" fill="none" stroke="#ffbd6b" stroke-width="2"/>
    </g>
  </g>

  <g id="embers" fill="#ffa557" filter="url(#glow)">
    <circle cx="326" cy="423" r="2"/><circle cx="359" cy="286" r="1.7"/><circle cx="530" cy="226" r="2"/>
    <circle cx="297" cy="546" r="1.7"/><circle cx="585" cy="451" r="1.5"/><circle cx="401" cy="197" r="1.5"/>
    <circle cx="477" cy="583" r="2"/><circle cx="554" cy="305" r="1.4"/><circle cx="602" cy="568" r="1.5"/>
    <circle cx="373" cy="488" r="1.2"/><circle cx="484" cy="174" r="1.4"/><circle cx="699" cy="559" r="1.2"/>
  </g>
  <g id="shot-sparks" fill="#ffc875" opacity="0" filter="url(#glow)">
    <circle r="2"/><circle r="1.5"/><circle r="2.5"/><circle r="1"/><circle r="2"/><circle r="1.5"/>
    <circle r="2"/><circle r="1.5"/><circle r="2.5"/><circle r="1"/><circle r="2"/><circle r="1.5"/>
  </g>
</svg>
